name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  # Both cron runs commit into docs/ with GITHUB_TOKEN — the weekly one
  # schedule.json, the daily one runs.json — and pushes made with that token
  # don't fire the `push` trigger above, so chain off the runs instead.
  workflow_run:
    workflows: ['Dodgers Weekly Schedule', 'Dodgers Daily Check']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A workflow_run checkout would otherwise land on the commit the weekly
          # run started from — before the schedule commit it just pushed.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

      - id: deploy
        uses: actions/deploy-pages@v5
